<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%" fill="none">
  <!-- Hülya Tuncer – Fluid Ribbon Loop (Continuous Journey of Empathy) -->
  <defs>
    <linearGradient id="ribbonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C59B54" />
      <stop offset="45%" stop-color="#DFB76C" />
      <stop offset="75%" stop-color="#BA715C" />
      <stop offset="100%" stop-color="#C59B54" />
    </linearGradient>

    <filter id="ribbonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2621" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- EMBLEM: Asymmetric Organic Infinity Loop -->
  <g transform="translate(18, 14)" filter="url(#ribbonShadow)">
    <path d="M 28 35 
             C 12 44, 10 65, 24 74 
             C 38 82, 54 68, 64 54 
             C 74 40, 88 32, 94 44 
             C 100 56, 90 74, 76 74 
             C 62 74, 52 58, 44 46 
             C 36 34, 42 26, 28 35 Z" 
          stroke="url(#ribbonGold)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          fill="none" />
  </g>

  <!-- TYPOGRAPHY -->
  <g transform="translate(142, 22)">
    <text x="0" y="38" 
          font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
          font-size="32" 
          font-weight="800" 
          fill="#1B2621" 
          letter-spacing="0.5">
      HÜLYA TUNCER
    </text>

    <text x="2" y="62" 
          font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
          font-size="11.5" 
          font-weight="600" 
          fill="#C59B54" 
          letter-spacing="2.8">
      İLİŞKİ &amp; AİLE DANIŞMANLIĞI
    </text>

    <text x="2" y="80" 
          font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
          font-size="10.5" 
          font-weight="400" 
          fill="#6B7280" 
          letter-spacing="0.4">
      Çocuk Gelişimi • Doğada Aile • Gluco Destek
    </text>
  </g>
</svg>
