<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Sage to Deep Forest Gradient -->
    <linearGradient id="emblemSageGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B4332" />
      <stop offset="50%" stop-color="#2D6A4F" />
      <stop offset="100%" stop-color="#40916C" />
    </linearGradient>

    <!-- Warm Terracotta & Peach Gradient -->
    <linearGradient id="emblemWarmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E07A5F" />
      <stop offset="60%" stop-color="#C27D72" />
      <stop offset="100%" stop-color="#9B4B42" />
    </linearGradient>

    <!-- Golden Aura Gradient -->
    <linearGradient id="emblemGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4A261" />
      <stop offset="100%" stop-color="#E76F51" />
    </linearGradient>

    <!-- Soft Ambient Shadow -->
    <filter id="emblemShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1B4332" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Circular Outer Subtle Balance Ring -->
  <circle cx="100" cy="100" r="92" stroke="#2D6A4F" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.25" />
  <circle cx="100" cy="100" r="96" stroke="#C27D72" stroke-width="1" opacity="0.18" />

  <g filter="url(#emblemShadow)">
    <!-- 1. PARENT / SHELTER ARCH (Kucaklayan Ebeveyn / Koruyucu Dal) -->
    <!-- Starts from base, swoops up gracefully forming outer heart arch & head -->
    <path d="M 68 152
             C 42 136, 30 102, 42 70
             C 52 44, 76 34, 100 48
             C 106 52, 110 58, 110 65
             C 110 74, 102 82, 92 80
             C 74 76, 60 90, 60 108
             C 60 126, 75 142, 94 148
             C 84 152, 75 153, 68 152 Z"
          fill="url(#emblemSageGrad)" />

    <!-- 2. CHILD / SPROUT EMBRACE (Gelişen Çocuk & Hayat Yaprağı) -->
    <!-- Originates from inside the heart, reaching upwards towards light -->
    <path d="M 100 162
             C 124 154, 158 132, 162 98
             C 165 72, 148 48, 122 42
             C 114 40, 104 43, 102 51
             C 100 58, 106 65, 114 68
             C 130 74, 138 90, 134 108
             C 130 126, 116 142, 98 150
             C 99 154, 99.5 158, 100 162 Z"
          fill="url(#emblemWarmGrad)" />

    <!-- 3. INNER HARMONY & RECONNECTION LOOP (Bağ ve Güven Döngüsü) -->
    <!-- A continuous inner ribbon that bonds the two figures -->
    <path d="M 94 148
             C 80 134, 76 112, 86 94
             C 94 80, 110 82, 118 96
             C 124 108, 118 126, 104 136
             C 96 144, 95 146, 94 148 Z"
          fill="#52B788"
          opacity="0.9" />

    <!-- 4. SPROUT / SEED NODE (Büyüme & Yaşam Tohumu) -->
    <!-- Child Head / Growing Sprout Leaf -->
    <ellipse cx="102" cy="74" rx="7.5" ry="9" fill="url(#emblemGoldGrad)" />

    <!-- Parent Head (Mindful Presence & Calm) -->
    <ellipse cx="88" cy="44" rx="9" ry="10" fill="url(#emblemSageGrad)" />
    
    <!-- Life Droplet / Health Light (Glucoecosystem & Vitality Accent) -->
    <circle cx="128" cy="54" r="5" fill="#3B82F6" opacity="0.85" />
  </g>
</svg>
