    <radialGradient id="emblemPearl" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF3D1" />
      <stop offset="100%" stop-color="#B87D2B" />
    </radialGradient>
  </defs>

  <g transform="translate(0, 0)">
