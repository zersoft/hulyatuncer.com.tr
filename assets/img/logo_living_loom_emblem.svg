<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" width="100%" height="100%" fill="none">
  <!-- Hülya Tuncer – Hayatın Dokusu Emblem (1:1 Icon) -->
  <defs>
    <linearGradient id="emblemLoomGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B6E57" />
      <stop offset="100%" stop-color="#2D4636" />
    </linearGradient>
    <linearGradient id="emblemLoomGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D79753" />
      <stop offset="100%" stop-color="#9C5C26" />
    </linearGradient>
    <linearGradient id="emblemSprout" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6F9473" />
      <stop offset="100%" stop-color="#A5B88D" />
