<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background glow / soft radial aura -->
    <radialGradient id="sunAura" cx="50%" cy="56%" r="40%">
      <stop offset="0%" stop-color="#F5EFE6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FDFBF7" stop-opacity="0" />
    </radialGradient>

    <!-- Rising Sun Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D49B42" />
      <stop offset="100%" stop-color="#E9BA62" />
    </linearGradient>

    <!-- River Pond Water Gradient -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#557C83" />
      <stop offset="50%" stop-color="#3C626A" />
      <stop offset="100%" stop-color="#284B52" />
    </linearGradient>

    <!-- Left Cradle Wing (Olive / Earth Moss) -->
    <linearGradient id="leftWingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#727346" />
      <stop offset="60%" stop-color="#535B3B" />
      <stop offset="100%" stop-color="#A4854B" />
    </linearGradient>

    <!-- Right Cradle Wing (Indigo / Deep Ocean) -->
    <linearGradient id="rightWingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3247" />
      <stop offset="70%" stop-color="#2A435C" />
      <stop offset="100%" stop-color="#345470" />
    </linearGradient>

    <!-- Leaves Gradients -->
    <linearGradient id="leafMoss" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4E6B5A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#739281" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="leafMint" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7D9D9F" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#A5C2C4" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="leafPeach" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BD7E62" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#DBA48E" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="leafIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E4A62" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#456682" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="leafTop" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#93A9A7" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#D3CBC2" stop-opacity="0.9" />
    </linearGradient>

    <!-- Gold Contour for Human Silhouettes -->
    <linearGradient id="contourGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C59B51" />
      <stop offset="50%" stop-color="#BA8E42" />
      <stop offset="100%" stop-color="#9E7530" />
    </linearGradient>
  </defs>

  <!-- 1. SOFT INNER AURA -->
  <circle cx="250" cy="270" r="160" fill="url(#sunAura)" />

  <!-- 2. RISING SUN (Doğan Güneş) -->
  <path d="M 210 295 A 40 40 0 0 1 290 295 Z" fill="url(#sunGrad)" />

  <!-- 3. WATER POND & FLOWING RIVER (Akıp Giden Hayat Nehri) -->
  <g>
    <!-- Oval Water Base -->
    <path d="M 152 320 C 152 295, 348 295, 348 320 C 348 358, 152 358, 152 320 Z" fill="url(#waterGrad)" />
    
    <!-- Flowing S-Curve River Path (Light Water Stream) -->
    <path d="M 210 297
             C 240 297, 275 303, 275 312
             C 275 322, 215 324, 205 334
             C 195 344, 255 352, 285 352
             C 245 358, 185 352, 195 336
             C 205 322, 260 320, 260 310
             C 260 304, 230 299, 210 297 Z"
          fill="#FDFBF7" />
  </g>

  <!-- 4. EMBRACING CRADLE WINGS (Kucaklayan Doğa ve Yuva Hilalleri) -->
  <!-- Left Wing (Olive / Moss / Earth) -->
  <path d="M 90 200
           C 72 260, 95 345, 170 395
           C 235 438, 305 425, 318 412
           C 260 418, 190 395, 140 345
           C 95 300, 85 245, 90 200 Z"
        fill="url(#leftWingGrad)" />

  <!-- Right Wing (Ocean Indigo / Deep Support) -->
  <path d="M 410 206
           C 426 270, 400 350, 328 402
           C 318 410, 312 414, 300 416
           C 335 390, 355 345, 345 295
           C 338 260, 310 230, 290 215
           C 330 230, 395 240, 410 206 Z"
        fill="url(#rightWingGrad)" />

  <!-- 5. BLOOMING LEAVES & LOTUS SPROUT (Çiçek Açan Bilinç ve Yaşam Filizi) -->
  <!-- Stem rising from the water and sun -->
  <path d="M 210 295 C 208 260, 250 240, 252 195" stroke="#2D4A43" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Leaf 1: Left Moss Leaf -->
  <path d="M 252 195 C 215 190, 188 155, 190 115 C 220 125, 245 160, 252 195 Z" fill="url(#leafMoss)" />

  <!-- Leaf 2: Center-Left Seafoam Mint Leaf -->
  <path d="M 252 195 C 235 160, 230 110, 250 72 C 268 110, 260 160, 252 195 Z" fill="url(#leafMint)" />

  <!-- Leaf 3: Top Crown Leaf -->
  <path d="M 250 72 C 242 90, 246 115, 252 135 C 258 115, 262 90, 250 72 Z" fill="url(#leafTop)" />

  <!-- Leaf 4: Right Peach Coral Leaf -->
  <path d="M 252 195 C 265 160, 285 130, 308 118 C 308 145, 285 178, 252 195 Z" fill="url(#leafPeach)" />

  <!-- Leaf 5: Bottom Right Indigo Leaf -->
  <path d="M 252 195 C 275 205, 305 190, 314 165 C 295 165, 268 180, 252 195 Z" fill="url(#leafIndigo)" />

  <!-- 6. GOLDEN SUMMIT SPHERE (Aydınlanma & Zihin Güneşi) -->
  <circle cx="250" cy="52" r="12" fill="url(#sunGrad)" />

  <!-- 7. TWO FACING HUMAN SILHOUETTES (Göz Göze Empatik İletişim Hatları) -->
  <!-- Left Profile (Adult / Parent / Spouse) -->
  <path d="M 125 142
           C 152 155, 172 185, 175 220
           C 176 226, 174 230, 185 233
           C 192 235, 190 242, 184 246
           C 178 250, 186 256, 186 262
           C 186 268, 176 272, 173 277
           C 168 284, 150 295, 142 345"
        stroke="url(#contourGold)"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none" />

  <!-- Right Profile (Partner / Child / Receptive Soul) -->
  <path d="M 380 165
           C 355 178, 335 210, 328 238
           C 326 244, 328 248, 320 252
           C 314 255, 315 260, 320 264
           C 324 268, 318 274, 320 280
           C 322 286, 328 290, 330 298
           C 334 315, 350 335, 354 350"
        stroke="url(#contourGold)"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none" />

</svg>
