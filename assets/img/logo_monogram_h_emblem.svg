<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <!-- Hülya Tuncer – Monogram H Emblem (1:1 Icon) -->
  <defs>
    <linearGradient id="emblemPillar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3A34" />
      <stop offset="100%" stop-color="#1B2621" />
    </linearGradient>
    <linearGradient id="emblemWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C59B54" />
      <stop offset="50%" stop-color="#DFB76C" />
      <stop offset="100%" stop-color="#C59B54" />
    </linearGradient>
  </defs>

  <g transform="translate(4, 4)">
    <!-- Left Pillar -->
    <path d="M 16 16
             C 16 8, 32 8, 32 8
             L 32 84
             C 32 84, 16 84, 16 76
             Z"
          fill="url(#emblemPillar)" />

    <!-- Right Pillar -->
    <path d="M 60 8
             C 60 8, 76 8, 76 16
             L 76 76
             C 76 84, 60 84, 60 84
             Z"
          fill="url(#emblemPillar)" />

    <!-- Dialogue Bridge Wave -->
    <path d="M 16 48
             C 30 40, 42 38, 52 44
             C 62 50, 68 54, 76 44
             L 76 54
             C 68 64, 62 60, 52 54
             C 42 48, 30 50, 16 58
             Z"
          fill="url(#emblemWave)" />
  </g>
</svg>
