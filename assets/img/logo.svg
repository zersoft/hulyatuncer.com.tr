<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%" fill="none">
  <!-- Background subtle glow (optional, transparent by default) -->
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E6B56" />
      <stop offset="100%" stop-color="#1B4739" />
    </linearGradient>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C27D72" />
      <stop offset="100%" stop-color="#E8A598" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Emblem: Tree of Life + Embracing Family + Heart Leaf -->
  <g transform="translate(10, 10)" filter="url(#subtleShadow)">
    <!-- Base / Trunk -->
    <path d="M50 88 C50 68 38 60 30 52 C24 46 22 36 28 28 C34 20 44 20 48 27 C50 18 60 14 68 18 C76 22 78 32 72 40 C80 44 82 56 76 64 C70 72 50 72 50 88 Z" fill="url(#primaryGrad)"/>
    <!-- Embracing Heart / Leaf Accent -->
    <path d="M42 38 C38 32 40 24 48 24 C54 24 58 30 50 42 C44 34 44 32 42 38 Z" fill="url(#warmGrad)"/>
    <circle cx="50" cy="22" r="5" fill="#E8A598"/>
    <!-- Foundation Ring -->
    <circle cx="50" cy="50" r="44" stroke="#2E6B56" stroke-width="2" stroke-dasharray="6 4" opacity="0.35"/>
    <circle cx="50" cy="50" r="48" stroke="#C27D72" stroke-width="1.2" opacity="0.4"/>
  </g>

  <!-- Typography -->
  <g transform="translate(115, 20)">
    <!-- Main Name -->
    <text x="0" y="44" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#1E3A2F" letter-spacing="-0.5">
      Hülya Tuncer
    </text>
    
    <!-- Subtitle / Title -->
    <text x="2" y="68" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#C27D72" letter-spacing="1.2">
      AİLE DANIŞMANI &amp; ÇOCUK GELİŞİMCİSİ
    </text>

    <!-- Tagline -->
    <text x="2" y="85" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#6B7280" letter-spacing="0.3">
      Güvenli Bağlar • Eko-Terapi • Glucoecosystem Desteği
    </text>
  </g>
</svg>
