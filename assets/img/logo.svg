<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%" fill="none">
  <!-- Hülya Tuncer – Scandinavian Monogram "H" (The Bridge of Connection) -->
  <!-- Two Autonomous Lives Connected by a Wave of Dialogue -->
  <defs>
    <!-- Soft Charcoal Tone for Pillars -->
    <linearGradient id="monoPillar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3A34" />
      <stop offset="100%" stop-color="#1B2621" />
    </linearGradient>

    <!-- Warm Champagne Gold for Dialogue Bridge -->
    <linearGradient id="waveGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C59B54" />
      <stop offset="50%" stop-color="#DFB76C" />
      <stop offset="100%" stop-color="#C59B54" />
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2621" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- ICON EMBLEM: Architectural "H" with Sinusoidal Dialogue Wave -->
  <g transform="translate(18, 14)" filter="url(#softShadow)">
    
    <!-- Left Pillar (Individual / Brother / Partner) -->
    <!-- Curved outer top shoulder, flat inner edge -->
    <path d="M 12 14
             C 12 6, 26 6, 26 6
             L 26 86
             C 26 86, 12 86, 12 78
             Z"
          fill="url(#monoPillar)" />

    <!-- Right Pillar (Individual / Sister / Partner) -->
    <path d="M 66 6
             C 66 6, 80 6, 80 14
             L 80 78
             C 80 86, 66 86, 66 86
             Z"
          fill="url(#monoPillar)" />

    <!-- Continuous Fluid Bridge Wave (The Dialogue / Shared Life) -->
    <path d="M 12 48
             C 26 40, 36 38, 46 44
             C 56 50, 66 54, 80 44
             L 80 54
             C 66 64, 56 60, 46 54
             C 36 48, 26 50, 12 58
             Z"
          fill="url(#waveGold)" />
  </g>

  <!-- TYPOGRAPHY: Swiss / Scandinavian Precision -->
  <g transform="translate(126, 22)">
    <!-- Brand Name -->
    <text x="0" y="38" 
          font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
          font-size="32" 
          font-weight="800" 
          fill="#1B2621" 
          letter-spacing="0.5">
      HÜLYA TUNCER
    </text>

    <!-- Subtitle: Universal Relationships & Family -->
    <text x="2" y="62" 
          font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
          font-size="11.5" 
          font-weight="600" 
          fill="#A87A38" 
          letter-spacing="2.8">
      İLİŞKİ &amp; AİLE DANIŞMANLIĞI
    </text>

    <!-- Focus Areas -->
    <text x="2" y="80" 
          font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
          font-size="10.5" 
          font-weight="400" 
          fill="#6B7280" 
          letter-spacing="0.4">
      Çocuk Gelişimi • Doğada Aile • Gluco Destek
    </text>
  </g>
</svg>
