<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 1080px;
      height: 1920px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      background: transparent;
      box-sizing: border-box;
      padding-bottom: 220px;
    }
    .caption-box {
      width: 880px;
      background: rgba(23, 21, 19, 0.78);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 36px;
      padding: 48px 56px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
    }
    .badge {
      display: inline-block;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #D4A373;
      margin-bottom: 24px;
    }
    .quote {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 42px;
      line-height: 1.45;
      font-style: italic;
      color: #FAF8F5;
      font-weight: 500;
      margin: 0 0 28px 0;
    }
    .divider {
      width: 80px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212, 163, 115, 0.6), transparent);
      margin: 0 auto 20px auto;
    }
    .author {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 20px;
      font-weight: 400;
      letter-spacing: 1.5px;
      color: rgba(250, 248, 245, 0.7);
    }
  </style>
</head>
<body>
  <div class="caption-box">
    <div class="badge">BİR İLİŞKİDE EN ÇOK YORAN ŞEY</div>
    <div class="quote">Birbirimize sesimizi duyurabilmek için<br>bağırmak zorunda kalmaktır.</div>
    <div class="divider"></div>
    <div class="author">Hülya Tuncer • Aile Danışmanı</div>
  </div>
</body>
</html>
